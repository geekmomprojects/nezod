<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://geekmomprojects.github.io/nezod/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezod Pet Gravity Simulator</title>
    <script>
      const nezod_to_earth = 1.3
      const nezod_to_telemo = 0.8
      var earthBox = document.getElementById('earth_val');
      var nezodBox = document.getElementById('nezod_val');
      var telemoBox = document.getElementById('telemo_val');
      
      earthBox.onkeyup = function(){
          nezodBox.value = earthBox.value/nezod_to_earth;
          telemoBox.value = nezodBox.value*nezod_to_telemo;
      }
      
      nezodBox.onkeyup = function(){
        earthBox.value = nezodBox.value*nezod_to_earth;
        telemoBox.value = nezodBox.value*nezod_to_telemo;
      }
      
      telemoBox.onkeyup = function(){
        earthBox.value = (telemoBox.value/nezod_to_telemo)*nezod_to_earth;
        nezodBox.value = telemoBox.value/nezod_to_telemo
      }
    </script>
  </head>
  <body>
    <br><br>
    Earth<br>
    <input type='number' step ="0.1" name='earth' id='earth_val'>
    <br><br>
    Nezod<br>
    <input type='number' step ="0.1" name='nezod' id='nezod_val'>
    <br><br>
    Telemo<br>
    <input type='number' step ="0.1" name='telemo' id='telemo_val'>
    <br><br>
    <script src="https://geekmomprojects.github.io/nezod/script.js"></script>
  </body>
</html>
