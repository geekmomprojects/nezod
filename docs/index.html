<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://geekmomprojects.github.io/nezod/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezod Pet Gravity Simulator</title>
    <script>
      var earthBox = document.getElementById('earth_val');
      var nezodBox = document.getElementById('nezod_val');
      var telemoBox = document.getElementById('telemo_val');
      
      earthBox.onkeyup = function(){
          nezodBox.value = earthBox.value;
          telemoBox.value = earthBox.value;
      }
      
      nezodBox.onkeyup = function(){
        earthBox.value = nezodBox.value;
        telemoBox.value = nezodBox.value;
      }
      
      telemoBox.onkeyup = function(){
        earthBox.value = telemoBox.value;
        nezodBox.value = telemoBox.value;
      }
    </script>
  </head>
  <body>
    <br><br>
    Earth<br>
    <input type='text' name='earth' class='chatinput' id='earth_val'>
    <br><br>
    Nezod<br>
    <input type='text' name='nezod' class='chatinput' id='nezod_val'>
    <br><br>
    Telemo<br>
    <input type='text' name='telemo' class='chatinput' id='telemo_val'>
    <br><br>
    <script src="https://geekmomprojects.github.io/nezod/script.js"></script>
  </body>
</html>
